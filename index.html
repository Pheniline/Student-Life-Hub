<!doctype html>
<html lang="en">
  <head>
    <title>Student Life Hub</title>
  </head>
  <body>
    <h1>Student Life Hub</h1>
    <input type="text" id="nameInput" placeholder="Enter your name" />
    <input type="text" id="courseInput" placeholder="Enter your course" />
    <input type="text" id="yearInput" placeholder="Enter your year" />
    <input
      type="text"
      id="universityInput"
      placeholder="Enter your university"
    />
    <button id="submitButton">Submit</button>
    <script src="script.js"></script>
    /* This script tag is used to include an external JavaScript file named
    "script.js" in the HTML document. The JavaScript code in this file can be
    used to add interactivity and dynamic behavior to the web page. */
  </body>
</html>
